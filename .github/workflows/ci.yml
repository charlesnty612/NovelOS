name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 单一依赖源：pyproject.toml（[project].dependencies 含 json-repair /
          # python-multipart，[dev] 含 pytest / ruff）。此前手写清单缺 json-repair
          # 与 python-multipart，收集期 ModuleNotFoundError 导致 CI 必红（R3 实证）。
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check packages tests scripts
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install pip-audit
          # 显式接受告警不阻断：方法论 05「不可用 = 显式拒绝或签字跳过」——`|| true`
          # 是签字跳过而非漏写；覆盖范围 fastapi / uvicorn / pydantic / jsonschema /
          # httpx / starlette / python-multipart / json-repair。告警定期人工复核后收紧。
          pip-audit --skip-editable fastapi uvicorn pydantic jsonschema httpx starlette python-multipart json-repair || true

  web:
    name: web (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  smoke:
    name: e2e smoke (state sync included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run e2e smoke
        run: python scripts/smoke_e2e.py