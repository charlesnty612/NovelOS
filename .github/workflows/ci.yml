name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          # pip 钉版（2026-10-23 task-4 / 对抗审查 A1）：此前是裸 `pip install --upgrade pip`
          # ⇒ 每次 CI 用的 pip 版本都随 PyPI 漂移，失败时无法复现。
          # 钉版口径 = **钉「当前无已知公告」的版本**（不是钉任意一个旧版）：
          #   pip 25.3 经 OSV.dev 实查有 5 条已知公告（GHSA-58qw-9mgm-455v /
          #   GHSA-6vgw-5pg2-w6jp / GHSA-jp4c-xjxw-mgf9 / GHSA-qwm4-qh6w-59xr /
          #   GHSA-wf93-45jw-7689，各带 PYSEC 别名）⇒ **不再使用**。
          #   pip 26.2.2 = 2026-10-20 发布，OSV.dev 实查 **0 条公告**；
          #   requires-python >=3.10 ⇒ backend/smoke 的 3.11 与 windows 的 3.12 都可用。
          #   （核对日期 2026-10-23；PyPI JSON + OSV.dev API 实查，非凭记忆。）
          python -m pip install --upgrade "pip==26.2.2"
          # 单一依赖源：pyproject.toml（[project].dependencies 含 json-repair /
          # python-multipart，[dev] 含 pytest / ruff / pytest-cov / pytest-xdist）。
          # 此前手写清单缺 json-repair 与 python-multipart，收集期 ModuleNotFoundError
          # 导致 CI 必红（R3 实证）。
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check packages tests scripts
      - name: Pytest
        run: python -m pytest tests/ -q
      - name: Contract self-checks (evidence table + skill package)
        run: |
          # 「闸门存在 ≠ 闸门在门框上」——这两条**契约产物类**看守此前只在本地跑，
          # CI 从不执行 ⇒ 它们的红永远没人看见（同本批修的 CI 30+ 次全红同族）。
          #   ① 证据表（packages/core/quality/detector_evidence.json）与**代码实际值**
          #      逐条相符（66 条代码引用 + 12 条行为探针；退出码 0/1/2）；
          #   ② 对外 skill 包的三平台清单 / frontmatter / 引用完整性合规
          #      （**52 项检查 + 12 条变异自检**；2026-10-22 批次十九起新增
          #        app-version-consistency 三条 + 变异 M8，此前写的 46+7 已过期；
          #        2026-10-23 task-4 起再补 web 三处版本副本 ⇒ 49 → 52，
          #        并补 M9–M12 让 web 三处**进脚本自己的变异矩阵** ⇒ 8 → 12
          #        （否则 CI 上该看守是「跑而不验」——对抗审查 A2 实测过这个缺口））。
          python scripts/detector_evidence_check.py
          python skills/novelos/scripts/check_skill_package.py --selftest
      - name: Mutation-spec precheck (read-only, ~1s)
        run: |
          # 「突变套件不进 CI」是已知缺口（全量约 13 分钟，只在发版前跑，见 AGENTS §四 三档闸位）。
          # 但**只读预检**只花约 1 秒，且它恰好覆盖全量跑的**一半目的**：
          # 「既有锚点没被本批改动打断」。锚点一断，这里立刻红 —— 比等某条突变
          # 在 13 分钟末尾报 [ABORT] 更早、更准，且不写任何源码。
          #   ① validate_specs.py：规格形态 / 锚点唯一性 / 替换有效性；
          #   ② run_spec.py --all --precheck：同一批判据的旁路复核（目标/测试文件存在、
          #      replacement 与 anchor 不同、锚点恰好命中 1 次）。
          python tests/mutation_specs/validate_specs.py
          python tests/mutation_specs/run_spec.py --all --precheck
      - name: Human-baseline proxy (synthetic corpus — NOT the human baseline)
        run: |
          # 内容仓 NovelOS-Content **不推 GitHub**（硬规则 5）⇒ CI 永远拿不到
          # 人类基线语料 ⇒「阈值是按人类基线校准过的」在 CI 上**不可复现**
          # （本仓已把这件事从「裸 skip」改成「显式记录 + 标记 + 可选转红」，
          #   见 tests/unit/quality/HUMAN_BASELINE.md）。
          # 此处跑**自造语料**校准器：它只证明算子活着、口径可复算，
          # **不得**用它改任何阈值。
          python scripts/human_baseline_synthetic.py
      - name: Dependency audit (pip-audit)
        run: |
          # pip-audit 钉版（2026-10-23 task-4 / 对抗审查 A1）：此前是裸 `pip install pip-audit`
          # ⇒ 工具版本随 PyPI 漂移。2.10.1 = 2026-10-23 实查的 **latest**（PyPI JSON），
          # OSV.dev 实查 **0 条公告**，requires-python >=3.10 ⇒ 两个 Python 版本都可用。
          python -m pip install "pip-audit==2.10.1"
          # 显式接受告警不阻断：方法论 05「不可用 = 显式拒绝或签字跳过」——`|| true`
          # 是签字跳过而非漏写；覆盖范围 fastapi / uvicorn / pydantic / jsonschema /
          # httpx / starlette / python-multipart / json-repair。告警定期人工复核后收紧。
          pip-audit --skip-editable fastapi uvicorn pydantic jsonschema httpx starlette python-multipart json-repair || true

  web:
    name: web (build + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test

  windows-compat:
    name: windows (OS-specific paths)
    runs-on: windows-latest
    steps:
      # 为什么要有这个 job（2026-10-22 项目 review 的 CI 覆盖缺口）：
      #   - 其余 3 个 job 全是 `ubuntu-latest` ⇒ **Windows 专属路径零覆盖**；
      #   - 而本仓三次真实事故都只在 Windows 上暴露：
      #     ① `os.kill(pid, 0)` 在 Windows 是**给控制台广播 Ctrl+C**（signal.CTRL_C_EVENT == 0）
      #        ⇒ 共享控制台时整棵进程树消失（`_child_creationflags()` 补 `CREATE_NEW_CONSOLE` 修的）；
      #     ② `DETACHED_PROCESS` 下 `os.kill(pid,0)` 抛 `WinError 87` ⇒ `_pid_alive` 误报「已死」；
      #     ③ 临时库删除留下孤儿进程（python.exe 是启动器 stub）。
      #   - Python 版本取 **3.12**（与开发机一致；backend job 是 3.11）⇒ 顺带覆盖 3.12 腿。
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          # pip 钉版（2026-10-23 task-4 / 对抗审查 A1）：同 backend job
          # （pip==26.2.2，2026-10-23 实查 latest 且 0 条公告）。
          python -m pip install --upgrade "pip==26.2.2"
          pip install -e ".[dev]"
      - name: Self-check (pytest-xdist importable)
        # 「闸门存在 ≠ 闸门在门框上」的同款：下面那步的 `-n 4` 在 xdist **没装**时
        # 只会报一句 `unrecognized arguments: -n` ⇒ 报错**不指向根因**（依赖没装），
        # 修法是「早失败 + 说清楚」：这里显式 import 一次。
        # ⚠️ 这条之所以必要：xdist 原先只在 `[dependency-groups]`（PEP 735 分组不进
        # wheel 元数据）⇒ `pip install -e ".[dev]"` **装不上** ⇒ 这个 job 的并发路径
        # **从未真正跑过**（2026-10-23 task-4 实测：CI 历史 47 次 34 红）。
        run: python -c "import xdist; print('pytest-xdist', xdist.__version__)"
      - name: Windows-only tests (skipped on Linux CI)
        # 这两个文件在 ubuntu 上整片 `skipif(not WIN)` / 走不到 → 只有这里真跑。
        run: python -m pytest tests/unit/test_pid_alive_windows_probe.py tests/unit/test_m1_lock.py -q
      - name: Parallel path smoke (xdist + temp dirs on Windows)
        # backend job 的 pytest **不带 `-n`**（串行）⇒ 并行路径在 CI 上零覆盖。
        # 这里跑一小片带 `-n 4`：覆盖 xdist worker 的临时目录/文件句柄/进程语义差异。
        run: python -m pytest tests/unit/quality tests/unit/test_no_core_to_workflows_dep.py -q -n 4

  smoke:
    name: e2e smoke (state sync included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          # pip 钉版（2026-10-23 task-4 / 对抗审查 A1）：同 backend job
          # （pip==26.2.2，2026-10-23 实查 latest 且 0 条公告）。
          python -m pip install --upgrade "pip==26.2.2"
          pip install -e ".[dev]"
      - name: Run e2e smoke
        run: python scripts/smoke_e2e.py