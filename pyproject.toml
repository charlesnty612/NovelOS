[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelos"
version = "3.10.1"
description = "NovelOS - local-first novel writing operating system"
requires-python = ">=3.11"
# 授权：AGPL-3.0-only（2026-10-19 裁决，见 README「授权状态」）。
# 这里用 classifier 而非 PEP 639 的 `license = "..."` SPDX 字符串——后者要 setuptools>=77，
# 而本仓 build-system 只钉 `setuptools>=68`；classifier 在所有版本上都能解析，且
# 许可证全文在根目录 LICENSE（逐字取自 gnu.org）。
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
]
dependencies = [
    # 版本锁定（==）：2026-08 发现无上界约束会拉到最新 fastapi/starlette，
    # 其 include_router 对本仓库的路由组装静默失效（24 个业务路由挂载为 0），
    # 症状为 /api 仅剩 health。锁定到经全量测试验证的基线版本。
    "fastapi==0.133.1",
    "starlette==1.3.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.13.4",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    # V3.x 拆书文件上传（multipart/form-data）：FastAPI/Starlette 的
    # Form/File 依赖 python-multipart；不引第三方解析库，沿用 FastAPI 官方依赖。
    "python-multipart==0.0.32",
    # 结构化输出第三级兜底：json_repair 用于 LLM 偶发的语法错误（缺逗号 / 未转义引号等），
    # 仅作为 strict=False 失败后的最后一道防线；不替代前两级「干净 JSON 零开销」路径。
    # 0.63.4 是 2026-08-25 发布版本（pypi latest），稳定且与 Python 3.11 兼容。
    "json_repair==0.63.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    # ⚠️ pytest-xdist / pytest-cov 原先只在 [dependency-groups]（PEP 735 的「开发期分组」）
    # ⇒ **`pip install -e ".[dev]"` 装不上**（wheel 元数据里没有它们）
    # ⇒ CI windows job 的 `pytest -n 4` 那步**从未真正跑过**（2026-10-23 task-4 实测：
    # 已装 METADATA 的 Requires-Dist 只有 pytest / ruff）。
    # ⇒ 发版纪律与 tests/README.md 都写「xdist 在 dev extra 里」⇒ 此处按同一口径对齐，
    # 并且**删掉 [dependency-groups]**（见文件末尾的说明）⇒ 全仓只剩这一处声明，
    # 两处不会漂移。
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# 测试文件豁免 E501：断言消息 / 长 mock payload / 长 URL 属测试语料，折行损可读性。
# 生产代码（packages / scripts）保持 120 严格约束（2026-09-06 审查批次一）。
"tests/**" = ["E501"]
# builders.py 门面全量再导出（V4.0 口径）：无消费方的名字保留 import 本体以保
# 深路径 import 行为不变，其 F401 属设计内，按文件豁免（不用文件级 noqa，
# 避免掩盖该文件未来真实的未使用 import）。
"packages/core/context_engine/builders.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# ⚠️ 2026-10-23（task-4）：原 `[dependency-groups] dev = [pytest-cov, pytest-xdist]` 已
# **删除** ⇒ 全部开发期依赖统一进 `[project.optional-dependencies].dev`。
# 理由（两条）：
#   ① **单一源**：PEP 735 分组不进 wheel 元数据 ⇒ `pip install -e ".[dev]"` 装不上
#      ⇒ 同一个包在两处声明（可选依赖 + 分组）必然会漂移。
#   ② **工具链口径一致**：`uv sync --extra dev`（本仓铁律 8 的唯一命令）现在就是
#      「装齐 pytest / ruff / xdist / cov」的唯一入口；裸 `uv sync` 仍会剪掉全部
#      开发期工具（与 README「不是裸 uv sync」同款）。
# ⚠️ 代价（如实记账）：**裸 `uv sync` 现在连 pytest-xdist / pytest-cov 一起剪掉**
#    （此前它们在分组里，裸 sync 会保留）⇒ 跑 `pytest -n 4` 前必须 `uv sync --extra dev`。
#    这与 AGENTS.md 铁律 8 既有的口径（「裸 uv sync 会 pruning 掉 ruff」）一致。
#    本仓是**本地优先的个人自用工具**，不发布 wheel ⇒ 分组不进元数据没有下游代价。
