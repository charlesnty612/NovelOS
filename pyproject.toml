[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelos"
version = "3.8.0"
description = "NovelOS - local-first novel writing operating system"
requires-python = ">=3.11"
dependencies = [
    # 版本锁定（==）：2026-08 发现无上界约束会拉到最新 fastapi/starlette，
    # 其 include_router 对本仓库的路由组装静默失效（24 个业务路由挂载为 0），
    # 症状为 /api 仅剩 health。锁定到经全量测试验证的基线版本。
    "fastapi==0.133.1",
    "starlette==1.3.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.13.4",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
    # V3.x 拆书文件上传（multipart/form-data）：FastAPI/Starlette 的
    # Form/File 依赖 python-multipart；不引第三方解析库，沿用 FastAPI 官方依赖。
    "python-multipart==0.0.32",
    # 结构化输出第三级兜底：json_repair 用于 LLM 偶发的语法错误（缺逗号 / 未转义引号等），
    # 仅作为 strict=False 失败后的最后一道防线；不替代前两级「干净 JSON 零开销」路径。
    # 0.63.4 是 2026-08-25 发布版本（pypi latest），稳定且与 Python 3.11 兼容。
    "json_repair==0.63.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
