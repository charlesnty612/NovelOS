[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novelos"
version = "3.8.0"
description = "NovelOS - local-first novel writing operating system"
requires-python = ">=3.11"
dependencies = [
    # 版本锁定（==）：2026-08 发现无上界约束会拉到最新 fastapi/starlette，
    # 其 include_router 对本仓库的路由组装静默失效（24 个业务路由挂载为 0），
    # 症状为 /api 仅剩 health。锁定到经全量测试验证的基线版本。
    "fastapi==0.133.1",
    "starlette==1.3.1",
    "uvicorn[standard]==0.41.0",
    "pydantic==2.13.4",
    "jsonschema==4.26.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]